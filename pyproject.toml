[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "decodo-crewai"
version = "0.0.0"
description = "Decodo Web Scraping API tools for CrewAI agents."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.14"
authors = [{ name = "Decodo", email = "support@decodo.com" }]
keywords = ["decodo", "crewai", "web-scraping", "agents", "tools"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # ToolFailure first shipped in 1.15.9.
    "crewai>=1.15.9",
    "decodo-sdk>=2.4.1",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.urls]
Homepage = "https://decodo.com"
Repository = "https://github.com/Decodo/crewAI"
Documentation = "https://help.decodo.com/docs/introduction"

[tool.hatch.build.targets.wheel]
packages = ["src/decodo_crewai"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
packages = ["decodo_crewai"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real Decodo API; needs DECODO_LIVE_API_KEY"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_parser = "conventional"

[tool.semantic_release.branches.main]
match = "main"
